name: CI and image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sanity:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: email_assist
          POSTGRES_DB: email_assist
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U email_assist -d email_assist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app image
        run: docker build --tag email-assist:ci .

      - name: Run safety and web smoke tests without external services
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PYTHONPATH=/tests \
            -v "$PWD/tests:/tests:ro" \
            email-assist:ci python -m unittest test_safety test_web -v

      - name: Test session security and score reuse against isolated database schemas
        run: |
          printf '%s' 'ci-only-password' > "$RUNNER_TEMP/email-assist-db-password"
          chmod 644 "$RUNNER_TEMP/email-assist-db-password"
          docker run --rm --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PGHOST=127.0.0.1 -e PGDATABASE=email_assist -e PGUSER=email_assist \
            -e PYTHONPATH=/tests \
            -v "$RUNNER_TEMP/email-assist-db-password:/run/secrets/db-password:ro" \
            -v "$PWD/tests:/tests:ro" \
            email-assist:ci python -m unittest test_auth test_sync -v

  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable Git history
        # Gitleaks v8.30.1; use the CLI so no license key or repository secret is needed.
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner

  publish:
    name: Publish image
    needs: [sanity, secrets]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          sbom: true
